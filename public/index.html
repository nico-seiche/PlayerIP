<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlayerIP</title>
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlayerIP">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <!-- Login -->
    <section id="login" class="screen" hidden>
      <form id="login-form" class="card" autocomplete="on">
        <h1>PlayerIP</h1>
        <label>Server-URL
          <input name="server" type="url" inputmode="url" placeholder="http://beispiel.tv:8080" required autocapitalize="off" autocorrect="off">
        </label>
        <label>Benutzername
          <input name="username" type="text" autocomplete="username" required autocapitalize="off" autocorrect="off">
        </label>
        <label>Passwort
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>Proxy-Zugriffsschlüssel
          <input name="key" type="password" autocomplete="off" required>
          <small>Der <code>ACCESS_KEY</code> aus deinen Vercel-Umgebungsvariablen.</small>
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="primary">Anmelden</button>
      </form>
    </section>

    <!-- Hauptansicht: Start -> Bereich -> Anbieter -> Liste -->
    <section id="browse" class="screen" hidden>
      <header class="topbar">
        <button id="nav-back" class="icon" aria-label="Zurück" hidden>‹</button>
        <h1 id="nav-title">PlayerIP</h1>
        <button id="menu-btn" class="icon" aria-label="Einstellungen">⚙︎</button>
      </header>

      <!-- Start: drei Bereiche -->
      <div id="home" class="home">
        <button class="home-card" data-section="live">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 21h8M12 18v3M9 3l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span><strong>Live</strong><small>Sender und Programm</small></span>
        </button>
        <button class="home-card" data-section="vod">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7.5 4v16M16.5 4v16M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span><strong>Filme</strong><small>Nach Anbieter, Genre und Bewertung</small></span>
        </button>
        <button class="home-card" data-section="series">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 5h11M9 2h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10.5 11.5v5l4.2-2.5z" fill="currentColor"/></svg>
          <span><strong>Serien</strong><small>Nach Anbieter, Genre und Bewertung</small></span>
        </button>
        <button class="home-fav" data-section="fav">★ Favoriten</button>
      </div>

      <!-- Filme / Serien: Anbieter-Kacheln und weitere Kategorien -->
      <div id="groups" hidden>
        <p id="groups-status" class="status" hidden></p>
        <div id="tiles" class="tiles"></div>
        <div id="all-wrap"></div>
        <details id="more" class="more" hidden>
          <summary><span id="more-title">Weitere Kategorien</span></summary>
          <div id="more-list"></div>
        </details>
      </div>

      <!-- Liste mit Suche und Filtern -->
      <div id="listview" hidden>
        <div class="search-row">
          <input id="search" type="search" placeholder="Suchen …" aria-label="Suchen" autocomplete="off">
          <button id="filter-toggle" type="button" aria-expanded="false">Filter <span id="filter-badge" class="filter-badge" hidden></span></button>
        </div>
        <div id="filter-panel" class="filters extra" hidden>
          <select id="category" aria-label="Kategorie" hidden></select>
          <select id="lang" aria-label="Sprache" hidden></select>
          <select id="genre" aria-label="Genre" hidden></select>
          <select id="rating" aria-label="Bewertung" hidden></select>
          <select id="sort" aria-label="Sortierung" hidden></select>
          <select id="playable" aria-label="Abspielbarkeit" hidden>
            <option value="">Alle Formate</option>
            <option value="1">Nur abspielbare</option>
          </select>
          <div id="genre-load" class="genre-load" hidden>
            <span id="genre-load-text"></span>
            <button id="genre-load-btn" type="button">Genres laden</button>
            <span id="genre-load-info"></span>
          </div>
        </div>
        <p id="status" class="status" hidden></p>
        <ul id="list" class="list"></ul>
        <div id="sentinel"></div>
      </div>
    </section>

    <!-- Detailseite (Film / Serie) -->
    <section id="detail" class="sheet" hidden>
      <header class="topbar">
        <button id="detail-back" class="icon" aria-label="Zurück">‹</button>
        <h2 id="detail-title"></h2>
      </header>
      <div id="detail-head" class="detail-head"></div>
      <div id="detail-body"></div>
    </section>

    <!-- Player -->
    <section id="player" class="player" hidden>
      <video id="video" playsinline webkit-playsinline controls x-webkit-airplay="allow" autoplay></video>
      <div class="player-bar">
        <button id="player-close" class="icon" aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
        <div class="player-info">
          <strong id="player-title"></strong>
          <span id="player-sub"></span>
        </div>
        <button id="airplay" class="icon" aria-label="AirPlay" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 22h12l-6-6zM21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4v-2H3V5h18v12h-4v2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </button>
      </div>
      <p id="player-error" class="error" role="alert" hidden></p>
    </section>

    <!-- Einstellungen -->
    <dialog id="settings">
      <form method="dialog" class="card">
        <h2>Einstellungen</h2>
        <label class="row">
          <input type="checkbox" id="opt-proxy">
          Streams immer über den Proxy laden
        </label>
        <small>Nur nötig, wenn Wiedergabe direkt nicht klappt (z. B. http-Server auf https-Seite wird automatisch über den Proxy geladen). Belastet dein Vercel-Kontingent.</small>
        <button id="refresh-btn" type="button">Listen neu laden</button>
        <button id="logout-btn" type="button" class="danger">Abmelden</button>
        <button value="close" class="primary">Fertig</button>
      </form>
    </dialog>
  </main>

  <script src="/vendor/hls.min.js"></script>
  <script src="/providers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
